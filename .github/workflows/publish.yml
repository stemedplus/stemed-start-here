name: Publish

# Publishes the Start Here page to GitHub Pages on every change to main and every day, after
# refreshing the shared STEMEd+ look (green band, menu, footer) and the STEMEd+ member count
# (site/members.json, which the stemedplus.org homepage shows).
# Turn on once: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh the shared STEMEd+ look
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/stemedplus/stemedplus-theme.git "$RUNNER_TEMP/stemedplus-theme"
          python "$RUNNER_TEMP/stemedplus-theme/apply.py" .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Refresh the member count
        run: python scripts/member_count.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    # Publishing is its own job, after the build, as GitHub recommends for Pages. If it ever
    # fails, "Re-run failed jobs" publishes the same build again without uploading it twice.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
